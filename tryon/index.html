<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLEMATE - 虛擬試穿</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-50: #eff6ff;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
            --primary-700: #1d4ed8;
            --secondary-400: #fb7185;
            --secondary-500: #f43f5e;
            --secondary-600: #e11d48;
            --accent: #8b5cf6;
            --neutral-cream: #fefdf8;
            --neutral-light: #f8fafc;
            --neutral-medium: #64748b;
            --neutral-dark: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, var(--neutral-cream) 0%, var(--primary-50) 50%, var(--secondary-50) 100%);
            min-height: 100vh;
            color: var(--neutral-dark);
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 0;
            margin-bottom: 2rem;
            border-radius: 1rem 1rem 0 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(to bottom right, var(--primary-500), var(--primary-700));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logo-text {
            font-size: 1.125rem;
            font-weight: bold;
            color: var(--neutral-dark);
        }

        .back-link {
            color: var(--neutral-medium);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--primary-600);
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary-600), var(--secondary-500), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p {
            color: var(--neutral-medium);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .upload-box {
            border: 2px dashed var(--neutral-light);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: var(--neutral-cream);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .upload-box:hover {
            border-color: var(--primary-500);
            background: var(--primary-50);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
        }

        .upload-box.dragover {
            border-color: var(--primary-500);
            background: var(--primary-50);
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-shrink: 0;
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary-500), var(--secondary-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .upload-text {
            color: var(--neutral-dark);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--neutral-medium);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .upload-button {
            background: linear-gradient(to right, var(--primary-500), var(--primary-600));
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-button:hover {
            background: linear-gradient(to right, var(--primary-600), var(--primary-700));
            transform: translateY(-1px);
        }

        .preview-container {
            margin-top: 1.5rem;
            text-align: center;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }

        .preview-image {
            max-width: 100%;
            max-height: 300px;
            width: auto;
            height: auto;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            display: none;
            object-fit: contain;
        }

        .preview-image.show {
            display: block;
        }

        .generate-btn {
            width: 100%;
            padding: 1.25rem 2rem;
            background: linear-gradient(to right, var(--primary-500), var(--secondary-500));
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.3);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -5px rgba(59, 130, 246, 0.4);
            background: linear-gradient(to right, var(--primary-600), var(--secondary-600));
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--neutral-medium);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
            color: var(--primary-600);
        }

        .loading-spinner {
            border: 3px solid var(--neutral-light);
            border-top: 3px solid var(--primary-500);
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            margin-top: 3rem;
            text-align: center;
            display: none;
            background: var(--neutral-cream);
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .result-section h3 {
            color: var(--neutral-dark);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, var(--primary-600), var(--secondary-500));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-image {
            max-width: 100%;
            max-height: 600px;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin-bottom: 2rem;
            object-fit: contain;
        }

        .download-btn {
            background: linear-gradient(to right, var(--accent), #a855f7);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.3);
        }

        .download-btn:hover {
            background: linear-gradient(to right, #7c3aed, #9333ea);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -5px rgba(139, 92, 246, 0.4);
        }

        .error-message {
            background: linear-gradient(to right, #fef2f2, #fee2e2);
            color: var(--secondary-600);
            padding: 1.25rem;
            border-radius: 0.75rem;
            margin: 1.5rem 0;
            display: none;
            border-left: 4px solid var(--secondary-500);
        }

            @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">S</div>
                <span class="logo-text">STYLEMATE</span>
            </div>
            <a href="http://localhost:3002" class="back-link">← 返回首頁</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>✨ 虛擬試穿體驗</h1>
            <p>上傳您的照片與心儀服裝，AI 為您即時生成專業試穿效果</p>
        </div>

        <div class="upload-section">
            <div class="upload-box" onclick="handleUploadClick('person')">
                <div class="upload-content" id="personUploadContent">
                    <div class="upload-icon">👤</div>
                    <div class="upload-text">上傳個人全身照</div>
                    <div class="upload-hint">建議使用正面全身照，背景簡潔清晰</div>
                    <button class="upload-button">選擇照片</button>
                </div>
                <input type="file" id="personFile" accept="image/*">
                <div class="preview-container">
                    <img class="preview-image" id="personPreview" alt="個人照片預覽" title="點擊重新上傳">
                </div>
            </div>

            <div class="upload-box" onclick="handleUploadClick('garment')">
                <div class="upload-content" id="garmentUploadContent">
                    <div class="upload-icon">👗</div>
                    <div class="upload-text">上傳服裝照片</div>
                    <div class="upload-hint">清晰的服裝圖片，建議白色背景</div>
                    <button class="upload-button">選擇照片</button>
                </div>
                <input type="file" id="garmentFile" accept="image/*">
                <div class="preview-container">
                    <img class="preview-image" id="garmentPreview" alt="服裝照片預覽" title="點擊重新上傳">
                </div>
            </div>
        </div>



        <button class="generate-btn" onclick="generateTryOn()">
            🎯 開始 AI 虛擬試穿
        </button>

        <div class="loading">
            <div class="loading-spinner"></div>
            <div><strong>AI 正在處理中...</strong><br>預計需要 30-60 秒，請耐心等候</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="result-section" id="resultSection">
            <h3>✨ 虛擬試穿完成</h3>
            <img class="result-image" id="resultImage" alt="虛擬試穿結果">
            <br>
            <a class="download-btn" id="downloadBtn" download="stylemate_tryon_result.jpg">⬇️ 下載試穿圖片</a>
        </div>
    </div>

    <script>
        let personFile = null;
        let garmentFile = null;

        // 檢查 URL 參數，自動載入商品圖片
        function loadGarmentFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const garmentUrl = urlParams.get('garmentUrl');
            const productName = urlParams.get('productName');
            
            if (garmentUrl) {
                // 顯示商品資訊
                if (productName) {
                    document.querySelector('.page-header h1').textContent = `✨ ${productName} - 虛擬試穿`;
                }
                
                // 載入商品圖片
                loadImageFromURL(garmentUrl, 'garment');
            }
        }

        function loadImageFromURL(imageUrl, type) {
            // 使用代理服務載入圖片，避免 CORS 問題
            const proxyUrl = `/proxy-image?url=${encodeURIComponent(imageUrl)}`;
            
            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('圖片載入失敗');
                    }
                    return response.blob();
                })
                .then(blob => {
                    const file = new File([blob], 'garment.jpg', { type: blob.type || 'image/jpeg' });
                    handleFileUpload(file, type);
                })
                .catch(error => {
                    console.error('載入商品圖片失敗:', error);
                    showError('載入商品圖片失敗，請手動上傳圖片');
                });
        }

        // 處理檔案上傳
        document.getElementById('personFile').addEventListener('change', function(e) {
            handleFileUpload(e.target.files[0], 'person');
        });

        document.getElementById('garmentFile').addEventListener('change', function(e) {
            handleFileUpload(e.target.files[0], 'garment');
        });

        function handleUploadClick(type) {
            const fileInputId = type === 'person' ? 'personFile' : 'garmentFile';
            document.getElementById(fileInputId).click();
        }

        function handleFileUpload(file, type) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const previewId = type === 'person' ? 'personPreview' : 'garmentPreview';
                const uploadContentId = type === 'person' ? 'personUploadContent' : 'garmentUploadContent';
                
                const preview = document.getElementById(previewId);
                const uploadContent = document.getElementById(uploadContentId);
                
                preview.src = e.target.result;
                preview.classList.add('show');
                uploadContent.style.display = 'none'; // 隱藏上傳按鈕區域
                
                if (type === 'person') {
                    personFile = file;
                } else {
                    garmentFile = file;
                }
                
                updateGenerateButton();
            };
            reader.readAsDataURL(file);
        }

        function updateGenerateButton() {
            const btn = document.querySelector('.generate-btn');
            if (personFile && garmentFile) {
                btn.disabled = false;
                btn.textContent = '🎯 開始 AI 虛擬試穿';
            } else {
                btn.disabled = true;
                btn.textContent = '請先上傳個人照片和服裝照片';
            }
        }

        // 拖拽上傳
        document.querySelectorAll('.upload-box').forEach(box => {
            box.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });

            box.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });

            box.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const type = this === document.querySelector('.upload-box') ? 'person' : 'garment';
                    handleFileUpload(files[0], type);
                    
                    // 觸發對應的 input 元素
                    const inputId = type === 'person' ? 'personFile' : 'garmentFile';
                    document.getElementById(inputId).files = files;
                }
            });
        });

        async function generateTryOn() {
            if (!personFile || !garmentFile) {
                showError('請先上傳人體照片和服裝照片');
                return;
            }

            // 顯示載入狀態
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.generate-btn').disabled = true;
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';

            try {
                // 準備表單資料
                const formData = new FormData();
                formData.append('personFile', personFile);
                
                // 處理服裝圖片（現在都是 File 物件）
                if (garmentFile instanceof File) {
                    formData.append('garmentFile', garmentFile);
                } else {
                    throw new Error('請先上傳服裝圖片');
                }
                
                // 使用預設值
                formData.append('garmentDesc', 'A beautiful garment');
                formData.append('denoiseSteps', '30');
                formData.append('seed', '42');
                formData.append('autoMask', 'true');
                formData.append('cropImage', 'false');
                
                submitFormData(formData);
            } catch (error) {
                console.error('錯誤:', error);
                showError('生成失敗：' + error.message);
                // 隱藏載入狀態
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.generate-btn').disabled = false;
                updateGenerateButton();
            }
        }

        async function submitFormData(formData) {
            try {
                // 發送請求到後端
                const response = await fetch('/api/tryon', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('伺服器錯誤：' + response.status);
                }

                const result = await response.json();

                if (result.success) {
                    // 顯示結果
                    document.getElementById('resultImage').src = result.resultUrl;
                    document.getElementById('downloadBtn').href = result.resultUrl;
                    document.getElementById('resultSection').style.display = 'block';
                } else {
                    throw new Error(result.error || '生成失敗');
                }

            } catch (error) {
                console.error('錯誤:', error);
                showError('生成失敗：' + error.message);
            } finally {
                // 隱藏載入狀態
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.generate-btn').disabled = false;
                updateGenerateButton();
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 初始化
        updateGenerateButton();
        loadGarmentFromURL(); // 載入 URL 參數中的商品圖片
    </script>
</body>
</html>
